<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PulseCheck — Login</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:#f7f7f7;color:#111;display:grid;place-items:center;padding:24px}.wrap{width:min(940px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid #e5e5e5;border-radius:24px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.08)}.intro{background:#111;color:#fff;padding:48px}.intro h1{font-size:42px;margin:10px 0}.intro p{color:#bbb;line-height:1.7}.box{padding:42px}.tabs{display:flex;gap:8px;margin-bottom:22px}.tab{flex:1;padding:11px;border:1px solid #ddd;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}.tab.active{background:#111;color:#fff}.field{margin-bottom:13px}.field label{display:block;font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:7px;color:#666}.field input,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font:inherit}.btn{width:100%;border:0;background:#111;color:#fff;padding:14px;border-radius:11px;font-weight:800;cursor:pointer;margin-top:6px}.msg{display:none;margin-top:12px;padding:11px;border-radius:10px;background:#ffe8e8;color:#b42318;font-size:13px;font-weight:700}.hint{font-size:12px;color:#777;line-height:1.6;margin-top:15px}@media(max-width:760px){.wrap{grid-template-columns:1fr}.intro{padding:30px}.intro h1{font-size:32px}.box{padding:30px}}</style></head>
<body><div class="wrap"><div class="intro"><div style="font-weight:800;font-size:20px">♨ PulseCheck</div><h1>See the problem.<br>Solve the problem.</h1><p>AI-powered team progress and mentor support for fast-moving teams.</p></div><div class="box"><div class="tabs"><button class="tab active" id="loginTab" onclick="showLogin()">Sign in</button><button class="tab" id="registerTab" onclick="showRegister()">Create account</button></div>
<form id="loginForm"><div class="field"><label>EMAIL</label><input id="loginEmail" type="email" required></div><div class="field"><label>PASSWORD</label><input id="loginPassword" type="password" required></div><button class="btn">Sign in</button></form>
<form id="registerForm" style="display:none"><div class="field"><label>NAME</label><input id="regName" required></div><div class="field"><label>EMAIL</label><input id="regEmail" type="email" required></div><div class="field"><label>PASSWORD</label><input id="regPassword" type="password" minlength="6" required></div><div class="field"><label>ROLE</label><select id="regRole"><option value="team">Team member</option><option value="mentor">Mentor</option></select></div><button class="btn">Create account</button><div class="hint">After signing in as a team member, choose <b>Create Team</b> or <b>Join Team</b>. A team is not created automatically.</div></form><div id="msg" class="msg"></div></div></div>
<script>const msg=document.getElementById('msg');function showMsg(t){msg.style.display='block';msg.textContent=t}function showLogin(){loginForm.style.display='block';registerForm.style.display='none';loginTab.classList.add('active');registerTab.classList.remove('active');msg.style.display='none'}function showRegister(){loginForm.style.display='none';registerForm.style.display='block';registerTab.classList.add('active');loginTab.classList.remove('active');msg.style.display='none'}loginForm.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:loginEmail.value,password:loginPassword.value})});const d=await r.json();if(r.ok)location.href='/dashboard';else showMsg(d.error||'Unable to sign in.')});registerForm.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:regName.value,email:regEmail.value,password:regPassword.value,role:regRole.value})});const d=await r.json();if(r.ok)location.href='/dashboard';else showMsg(d.error||'Unable to create account.')});</script></body></html>
